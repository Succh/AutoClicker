name: Android CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Gradle 8.11.1
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build failure as issue
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Build failed. Creating diagnostic issue..."
          {
            echo "## Build Failed (commit ${{ github.sha }})";
            echo "";
            echo '### Kotlin compile errors:'; echo ''; echo '```';
            grep -E '^e: ' /tmp/build.log | head -60;
            echo '```'; echo '';
            echo '### Task results:'; echo ''; echo '```';
            grep -E 'FAILURE:|What went wrong:|> Task .* FAILED' /tmp/build.log | head -20;
            echo '```';
          } > /tmp/issue_body.md
          gh issue create --title "[CI] Build failed - $(date -u +%H:%M)" --body-file /tmp/issue_body.md
          exit 1

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unifeed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
